<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Plant</title>
<meta name="description" content="AI が毎日、新しい音楽を製造しています。すべての楽曲は AI(Suno)により生成されたものです。">
<meta property="og:site_name" content="Music Plant">
<meta property="og:type" content="music.song">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1a17'/><text x='50' y='71' font-size='58' text-anchor='middle' fill='%23faf9f7' font-family='sans-serif' font-weight='bold'>M</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="track-header">
    <a class="wordmark" href="/">Music Plant</a>
    <a class="back" href="/">← すべての曲</a>
  </header>

  <div class="status" id="status" hidden></div>

  <main class="detail" id="detail" hidden>
    <div class="detail-cover"><img id="cover" alt=""></div>
    <div class="detail-info">
      <div class="detail-date" id="date"></div>
      <h1 class="detail-title" id="title"></h1>
      <div class="detail-models" id="models"></div>
      <div class="player">
        <button class="play-btn" id="btn">▶</button>
        <div class="seek-area">
          <div class="seek" id="seek"><i id="bar"></i></div>
          <div class="times"><span id="t-cur">0:00</span><span id="t-total">0:00</span></div>
        </div>
      </div>
      <p class="detail-intro" id="intro" hidden></p>
    </div>
  </main>

  <section class="lyrics-section" id="lyrics-section" hidden>
    <h2>歌詞</h2>
    <div class="lyrics" id="lyrics"></div>
  </section>

  <section class="others" id="others-section" hidden>
    <h2>ほかの曲</h2>
    <div class="others-grid" id="others"></div>
  </section>

  <footer>
    <div>このサイトの楽曲はすべて AI(Suno)により生成されたものです</div>
    <div class="en">All songs on this site are generated by AI. — Music Plant</div>
  </footer>
</div>
<script src="/common.js"></script>
<script src="/track.js"></script>
</body>
</html>
