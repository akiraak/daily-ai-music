<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Plant</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="layout">
  <aside class="sidebar">
    <div class="app-title">Music Plant</div>
    <nav class="menu">
      <a href="/admin/" class="active">楽曲一覧</a>
      <a href="/admin/artists.html">アーティスト</a>
      <a href="/admin/settings.html">設定</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <h1>楽曲一覧</h1>
      <div class="header-credits">
        <div id="credits" class="credits" title="残クレジット"></div>
        <a class="charge-link" href="https://kie.ai/billing" target="_blank" rel="noopener"
          title="kie.ai のチャージ画面を開く">チャージ</a>
      </div>
    </div>
    <section class="panel">
      <h2>音楽を生成</h2>
      <div class="form-row">
        <p class="empty">毎日の自動生成と同じフローで 1 曲つくります(参照曲を選ぶ → AI 作曲)</p>
        <button type="button" id="generate-button">生成する</button>
      </div>
      <p id="form-message" class="form-message" hidden></p>
    </section>

    <section class="panel" id="active-panel" hidden>
      <h2>生成中</h2>
      <ul id="active-tasks" class="task-list"></ul>
    </section>

    <section class="panel">
      <h2>楽曲一覧</h2>
      <ul id="tracks" class="track-list"></ul>
      <p id="tracks-empty" class="empty">まだ楽曲がありません。上のボタンから生成してください。</p>
    </section>

  </main>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
