<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パラメータ一覧 - Music Plant</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="layout">
  <aside class="sidebar">
    <div class="app-title">Music Plant</div>
    <nav class="menu">
      <a href="/admin/">楽曲一覧</a>
      <a href="/admin/artists.html">アーティスト</a>
      <a href="/admin/presets.html" class="active">パラメータ一覧</a>
      <a href="/admin/settings.html">設定</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <h1>パラメータ一覧</h1>
    </div>
    <section class="panel">
      <h2>リアルワード</h2>
      <p class="empty" id="words-note">直近に生成した曲の中心となった語。使い切ったワードは曲の中心に据えないよう AI に指示されます。</p>
      <table class="word-table" id="word-table" hidden>
        <thead>
          <tr><th>ワード</th><th>使用回数</th><th>残り回数</th><th>最終使用</th></tr>
        </thead>
        <tbody id="word-rows"></tbody>
      </table>
      <p class="empty" id="words-empty" hidden>まだリアルワードがありません。生成すると記録されます。</p>
    </section>

    <section class="panel">
      <p class="empty">毎日の自動生成では、AI がこの一覧から評価(👍/👎 の集計)を踏まえて要素を選んで作曲します。👍/👎 はその要素を使った曲への評価の集計です。</p>
      <div id="preset-groups"></div>
      <form id="preset-form" class="preset-form">
        <input id="preset-category" list="preset-category-list"
          placeholder="カテゴリ (genre 等)" required>
        <datalist id="preset-category-list"></datalist>
        <input id="preset-value" placeholder="値(英語・プロンプト用)" required>
        <input id="preset-label" placeholder="表示名(日本語)" required>
        <button type="submit">追加</button>
      </form>
      <p id="preset-message" class="form-message" hidden></p>
    </section>
  </main>
  </div>

  <script src="/admin/presets.js"></script>
</body>
</html>
