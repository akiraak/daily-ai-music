<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Plant — 案A 曲詳細</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf9f7;
    --text: #1c1a17;
    --muted: #8a847a;
    --faint: #b3ada2;
    --line: #e8e5df;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  header {
    padding: 30px 0 0;
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  }
  .wordmark {
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .back { font-size: 12.5px; color: var(--muted); }
  .back:hover { color: var(--text); }

  .detail {
    display: flex; align-items: center; gap: 56px;
    padding: 64px 0 72px;
  }
  .cover {
    width: 380px; height: 380px; flex: none;
    border-radius: 14px; overflow: hidden;
    background: var(--line);
    box-shadow: 0 2px 4px rgba(20, 16, 8, 0.1), 0 18px 48px rgba(20, 16, 8, 0.16);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .info { min-width: 0; flex: 1; }
  .date { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; }
  .title {
    margin-top: 8px;
    font-size: 34px; font-weight: 750; letter-spacing: -0.005em; line-height: 1.25;
  }
  .models {
    margin-top: 12px;
    font-size: 12px; color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .player { margin-top: 34px; display: flex; align-items: center; gap: 18px; max-width: 480px; }
  .play-btn {
    width: 58px; height: 58px; flex: none;
    border: none; border-radius: 50%;
    background: var(--text); color: var(--bg);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding-left: 4px;
    transition: transform 0.15s ease;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn.pause { padding-left: 0; }
  .seek-area { flex: 1; }
  .seek {
    height: 4px; border-radius: 2px;
    background: var(--line);
    cursor: pointer;
    position: relative;
  }
  .seek i {
    display: block; height: 100%; width: 0%;
    background: var(--text); border-radius: 2px;
  }
  .times {
    margin-top: 7px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .others { padding-bottom: 72px; }
  .others h2 {
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .others-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 22px;
  }
  .o-card { min-width: 0; }
  .o-cover {
    aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
    background: var(--line);
    box-shadow: 0 1px 2px rgba(20, 16, 8, 0.08), 0 5px 16px rgba(20, 16, 8, 0.07);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .o-card:hover .o-cover {
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(20, 16, 8, 0.1), 0 10px 24px rgba(20, 16, 8, 0.13);
  }
  .o-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .o-title {
    margin-top: 9px;
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-date { font-size: 11px; color: var(--muted); }

  footer {
    border-top: 1px solid var(--line);
    padding: 36px 0 48px;
    text-align: center;
    font-size: 12px; color: var(--muted); line-height: 2;
  }
  footer .en { color: var(--faint); }

  @media (max-width: 720px) {
    .wrap { padding: 0 20px; }
    header { padding-top: 22px; }
    .detail {
      flex-direction: column; align-items: stretch; gap: 30px;
      padding: 36px 0 52px;
      text-align: center;
    }
    .cover { width: min(78vw, 380px); height: min(78vw, 380px); margin: 0 auto; }
    .title { font-size: 25px; }
    .player { width: 100%; margin: 28px auto 0; }
    .others-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="wordmark" href="designA.html">Music Plant</a>
    <a class="back" href="designA.html">← すべての曲</a>
  </header>

  <main class="detail">
    <div class="cover"><img id="cover" alt=""></div>
    <div class="info">
      <div class="date" id="date"></div>
      <h1 class="title" id="title"></h1>
      <div class="models" id="models"></div>
      <div class="player">
        <button class="play-btn" id="btn">▶</button>
        <div class="seek-area">
          <div class="seek" id="seek"><i id="bar"></i></div>
          <div class="times"><span id="t-cur">0:00</span><span id="t-total">0:00</span></div>
        </div>
      </div>
    </div>
  </main>

  <section class="others">
    <h2>ほかの曲</h2>
    <div class="others-grid" id="others"></div>
  </section>

  <footer>
    <div>このサイトの楽曲はすべて AI(Suno)により生成されたものです</div>
    <div class="en">All songs on this site are generated by AI. — Music Plant</div>
  </footer>
</div>
<script src="data.js"></script>
<script>
  const id = Number(new URLSearchParams(location.search).get("id"));
  const track = TRACKS.find((t) => t.id === id) || TRACKS[0];

  document.title = `${track.title} — Music Plant`;
  document.getElementById("cover").src = IMG(track.file + ".jpeg");
  document.getElementById("date").textContent = `${fmtDateJa(track.createdAt)} · ${fmtDuration(track.duration)}`;
  document.getElementById("title").textContent = track.title;
  document.getElementById("models").textContent = modelLabel(track);
  document.getElementById("t-total").textContent = fmtDuration(track.duration);

  const audio = new Audio(AUD(track.file + ".mp3"));
  const btn = document.getElementById("btn");
  const bar = document.getElementById("bar");
  const seek = document.getElementById("seek");
  const tCur = document.getElementById("t-cur");
  const tTotal = document.getElementById("t-total");

  btn.addEventListener("click", () => {
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const refresh = () => {
    btn.textContent = audio.paused ? "▶" : "❚❚";
    btn.classList.toggle("pause", !audio.paused);
  };
  audio.addEventListener("play", refresh);
  audio.addEventListener("pause", refresh);
  audio.addEventListener("ended", refresh);
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    bar.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    tCur.textContent = fmtDuration(audio.currentTime);
    tTotal.textContent = fmtDuration(audio.duration);
  });
  seek.addEventListener("click", (e) => {
    if (!audio.duration) return;
    const r = seek.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  // ほかの曲(現在の曲を除く新しい順で 6 曲)
  const others = document.getElementById("others");
  for (const t of TRACKS.filter((t) => t.id !== track.id).slice(0, 6)) {
    const a = document.createElement("a");
    a.className = "o-card";
    a.href = "designA-detail.html?id=" + t.id;
    a.innerHTML = `
      <div class="o-cover"><img alt=""></div>
      <div class="o-title"></div>
      <div class="o-date"></div>`;
    a.querySelector("img").src = IMG(t.file + ".jpeg");
    a.querySelector(".o-title").textContent = t.title;
    a.querySelector(".o-date").textContent = fmtDateJa(t.createdAt);
    others.appendChild(a);
  }
</script>
</body>
</html>
