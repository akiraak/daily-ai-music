<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Plant — 案A ギャラリー・ミニマル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf9f7;
    --text: #1c1a17;
    --muted: #8a847a;
    --faint: #b3ada2;
    --line: #e8e5df;
    --accent: #1c1a17;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  header { padding: 56px 0 40px; }
  .wordmark {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .tagline { margin-top: 6px; font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 36px 28px;
    padding-bottom: 72px;
  }
  .card { cursor: pointer; min-width: 0; }
  .cover {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--line);
    box-shadow: 0 1px 2px rgba(20, 16, 8, 0.08), 0 6px 20px rgba(20, 16, 8, 0.07);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover .cover {
    transform: translateY(-3px);
    box-shadow: 0 2px 4px rgba(20, 16, 8, 0.1), 0 14px 32px rgba(20, 16, 8, 0.14);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 12, 8, 0.22);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .card:hover .play, .card.playing .play { opacity: 1; }
  @media (hover: none) { .play { opacity: 1; background: none; } }
  .play span {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);
    color: #171410;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 3px 12px rgba(15, 12, 8, 0.3);
  }
  @media (hover: none) {
    .play span { position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; font-size: 14px; }
  }
  .play .icon-play { padding-left: 4px; }

  .eq {
    position: absolute; left: 12px; bottom: 12px;
    display: none; align-items: flex-end; gap: 3px; height: 16px;
  }
  .card.playing .eq { display: flex; }
  .eq i { width: 3px; background: #fff; border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: 0.25s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: 0.5s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  .info { padding: 12px 2px 0; }
  .title {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .models {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 36px 0 48px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 2;
  }
  footer .en { color: var(--faint); }

  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    header { padding: 40px 0 28px; }
    .wordmark { font-size: 18px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; padding-bottom: 56px; }
    .info { padding-top: 9px; }
    .title { font-size: 13.5px; }
    .meta { font-size: 11px; }
    .models { font-size: 9.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">Music Plant</div>
    <div class="tagline">AI が毎日、新しい音楽を製造しています</div>
  </header>
  <main class="grid" id="grid"></main>
  <footer>
    <div>このサイトの楽曲はすべて AI(Suno)により生成されたものです</div>
    <div class="en">All songs on this site are generated by AI. — Music Plant</div>
  </footer>
</div>
<script src="data.js"></script>
<script>
  const grid = document.getElementById("grid");
  const audio = new Audio();
  let playingCard = null;

  for (const t of TRACKS) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="cover">
        <img alt="">
        <div class="eq"><i></i><i></i><i></i></div>
        <div class="play"><span class="icon-play">▶</span></div>
      </div>
      <div class="info">
        <div class="title"></div>
        <div class="meta"></div>
        <div class="models"></div>
      </div>`;
    card.querySelector("img").src = IMG(t.file + ".jpeg");
    card.querySelector(".title").textContent = t.title;
    card.querySelector(".meta").textContent = `${fmtDateJa(t.createdAt)} · ${fmtDuration(t.duration)}`;
    card.querySelector(".models").textContent = modelLabel(t);
    // カードは詳細ページへ、中央の ▶ ボタンだけ行内再生
    card.addEventListener("click", () => { location.href = "designA-detail.html?id=" + t.id; });
    card.querySelector(".play span").addEventListener("click", (e) => {
      e.stopPropagation();
      toggle(t, card);
    });
    grid.appendChild(card);
  }

  function toggle(t, card) {
    if (playingCard === card && !audio.paused) {
      audio.pause();
      setPlaying(null);
      return;
    }
    if (playingCard !== card) audio.src = AUD(t.file + ".mp3");
    audio.play();
    setPlaying(card);
  }
  function setPlaying(card) {
    if (playingCard) {
      playingCard.classList.remove("playing");
      playingCard.querySelector(".play span").textContent = "▶";
      playingCard.querySelector(".play span").classList.add("icon-play");
    }
    playingCard = card;
    if (card) {
      card.classList.add("playing");
      const btn = card.querySelector(".play span");
      btn.textContent = "❚❚";
      btn.classList.remove("icon-play");
    }
  }
  audio.addEventListener("ended", () => setPlaying(null));
</script>
</body>
</html>
