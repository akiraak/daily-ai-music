<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Plant — 案C デイリー・プレイヤー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-top: #1d1733;
    --bg-bottom: #0d0b14;
    --text: #efecf6;
    --muted: #9a93ad;
    --faint: #635d75;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #b18cff;
    --accent-deep: #7c5cff;
  }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 640px);
    background-color: var(--bg-bottom);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 96px;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 28px; }

  header { padding: 34px 0 8px; display: flex; align-items: baseline; gap: 14px; }
  .wordmark { font-size: 16px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
  .tagline { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

  .hero { display: flex; align-items: center; gap: 44px; padding: 44px 0 52px; }
  .hero-cover {
    width: 300px; height: 300px; flex: none;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(124, 92, 255, 0.32), 0 6px 22px rgba(0, 0, 0, 0.5);
  }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-info { min-width: 0; }
  .hero-label {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.22em;
    color: var(--accent); text-transform: uppercase;
  }
  .hero-title {
    margin-top: 10px;
    font-size: 38px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2;
  }
  .hero-meta { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .hero-models { margin-top: 4px; font-size: 11.5px; color: var(--faint); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .hero-play {
    margin-top: 26px;
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent);
    color: #17102b;
    border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 13px 30px;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(177, 140, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  .hero-play:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(177, 140, 255, 0.45); }

  .section-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.18em;
    color: var(--muted); text-transform: uppercase;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .date-head {
    margin: 26px 0 6px;
    font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em;
  }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 10px;
    margin: 0 -10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .row:hover { background: rgba(255, 255, 255, 0.05); }
  .row-cover { width: 48px; height: 48px; flex: none; border-radius: 8px; overflow: hidden; position: relative; }
  .row-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row-cover .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 8, 18, 0.55);
    color: #fff; font-size: 12px;
    opacity: 0;
  }
  .row:hover .overlay { opacity: 1; }
  .row.playing .overlay { opacity: 1; }
  .row-main { min-width: 0; flex: 1; }
  .row-title {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row.playing .row-title { color: var(--accent); }
  .row-models { margin-top: 1px; font-size: 11px; color: var(--faint); font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-dur { flex: none; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  footer {
    margin-top: 64px;
    border-top: 1px solid var(--line);
    padding: 30px 0 20px;
    text-align: center;
    font-size: 11.5px; color: var(--faint); line-height: 2;
  }

  /* 下部固定プレイヤー */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(18, 14, 32, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    transform: translateY(110%);
    transition: transform 0.3s ease;
    z-index: 10;
  }
  .player.visible { transform: translateY(0); }
  .player-inner {
    max-width: 920px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 28px 14px;
  }
  .player-cover { width: 42px; height: 42px; border-radius: 6px; overflow: hidden; flex: none; }
  .player-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player-main { flex: 1; min-width: 0; }
  .player-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { margin-top: 6px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
  .player-time { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .player-btn {
    flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--accent); color: #17102b;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    padding-left: 2px;
  }
  .player-btn.pause { padding-left: 0; }

  @media (max-width: 680px) {
    .wrap { padding: 0 20px; }
    header { padding-top: 26px; justify-content: center; }
    .tagline { display: none; }
    .hero { flex-direction: column; gap: 26px; padding: 26px 0 40px; text-align: center; }
    .hero-cover { width: min(72vw, 300px); height: min(72vw, 300px); }
    .hero-title { font-size: 27px; }
    .hero-meta { font-size: 12px; }
    .hero-play { padding: 12px 34px; }
    .row-models { display: none; }
    .player-inner { padding: 10px 20px 14px; }
    .player-time { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">Music Plant</div>
    <div class="tagline">AI Music, Every Day</div>
  </header>

  <section class="hero" id="hero"></section>

  <section>
    <div class="section-title">これまでの曲</div>
    <div id="list"></div>
  </section>

  <footer>
    <div>このサイトの楽曲はすべて AI(Suno)により生成されたものです</div>
    <div>All songs on this site are generated by AI. — Music Plant</div>
  </footer>
</div>

<div class="player" id="player">
  <div class="player-inner">
    <div class="player-cover"><img id="p-img" alt=""></div>
    <div class="player-main">
      <div class="player-title" id="p-title"></div>
      <div class="progress"><i id="p-bar"></i></div>
    </div>
    <div class="player-time" id="p-time">0:00 / 0:00</div>
    <button class="player-btn" id="p-btn">▶</button>
  </div>
</div>

<script src="data.js"></script>
<script>
  const latest = TRACKS[0];
  const audio = new Audio();
  let current = null;
  const rowsById = new Map();

  // ヒーロー(最新曲)
  const hero = document.getElementById("hero");
  hero.innerHTML = `
    <div class="hero-cover"><img alt=""></div>
    <div class="hero-info">
      <div class="hero-label"></div>
      <div class="hero-title"></div>
      <div class="hero-meta"></div>
      <div class="hero-models"></div>
      <button class="hero-play">▶ 再生する</button>
    </div>`;
  hero.querySelector("img").src = IMG(latest.file + ".jpeg");
  hero.querySelector(".hero-label").textContent = `Latest — ${localDateKey(latest.createdAt).replaceAll("-", ".")}`;
  hero.querySelector(".hero-title").textContent = latest.title;
  hero.querySelector(".hero-meta").textContent = `${fmtDateJa(latest.createdAt)} · ${fmtDuration(latest.duration)}`;
  hero.querySelector(".hero-models").textContent = modelLabel(latest);
  hero.querySelector(".hero-play").addEventListener("click", () => toggle(latest));

  // 日付グループのリスト
  const list = document.getElementById("list");
  const todayKey = localDateKey(TRACKS[0].createdAt);
  for (const g of groupByDate(TRACKS)) {
    const head = document.createElement("div");
    head.className = "date-head";
    head.textContent = g.key === todayKey ? "今日" : fmtDateJa(g.tracks[0].createdAt);
    list.appendChild(head);
    for (const t of g.tracks) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="row-cover"><img alt=""><div class="overlay">▶</div></div>
        <div class="row-main">
          <div class="row-title"></div>
          <div class="row-models"></div>
        </div>
        <div class="row-dur"></div>`;
      row.querySelector("img").src = IMG(t.file + ".jpeg");
      row.querySelector(".row-title").textContent = t.title;
      row.querySelector(".row-models").textContent = modelLabel(t);
      row.querySelector(".row-dur").textContent = fmtDuration(t.duration);
      row.addEventListener("click", () => toggle(t));
      rowsById.set(t.id, row);
      list.appendChild(row);
    }
  }

  // 下部プレイヤー
  const player = document.getElementById("player");
  const pImg = document.getElementById("p-img");
  const pTitle = document.getElementById("p-title");
  const pBar = document.getElementById("p-bar");
  const pTime = document.getElementById("p-time");
  const pBtn = document.getElementById("p-btn");
  pBtn.addEventListener("click", () => { if (current) toggle(current); });

  function toggle(t) {
    if (current && current.id === t.id && !audio.paused) {
      audio.pause();
      refresh();
      return;
    }
    if (!current || current.id !== t.id) {
      current = t;
      audio.src = AUD(t.file + ".mp3");
      pImg.src = IMG(t.file + ".jpeg");
      pTitle.textContent = t.title;
      pBar.style.width = "0%";
    }
    audio.play();
    player.classList.add("visible");
    refresh();
  }
  function refresh() {
    const playing = current && !audio.paused;
    pBtn.textContent = playing ? "❚❚" : "▶";
    pBtn.classList.toggle("pause", playing);
    for (const [id, row] of rowsById) {
      const active = playing && current.id === id;
      row.classList.toggle("playing", active);
      row.querySelector(".overlay").textContent = active ? "❚❚" : "▶";
    }
  }
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    pBar.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    pTime.textContent = `${fmtDuration(audio.currentTime)} / ${fmtDuration(audio.duration)}`;
  });
  audio.addEventListener("ended", refresh);
</script>
</body>
</html>
