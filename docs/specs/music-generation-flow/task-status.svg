<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#787D2B"/>
    </marker>
    <marker id="arrow3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0483C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="350" rx="14" fill="#FDF2E5"/>

  <!-- 状態(左 4 つは kie.ai、COMPLETE はサーバーが付与) -->
  <rect x="24" y="60" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="99" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A382F">PENDING</text>
  <text x="99" y="108" text-anchor="middle" font-size="11" fill="#8A8578">待機中</text>

  <rect x="198" y="60" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="273" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A382F">TEXT_SUCCESS</text>
  <text x="273" y="101" text-anchor="middle" font-size="11" fill="#8A8578">歌詞生成完了</text>
  <text x="273" y="115" text-anchor="middle" font-size="11" fill="#8A8578">音声生成中</text>

  <rect x="372" y="60" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="447" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A382F">FIRST_SUCCESS</text>
  <text x="447" y="108" text-anchor="middle" font-size="11" fill="#8A8578">1 曲目完了</text>

  <rect x="546" y="60" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="621" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A382F">SUCCESS</text>
  <text x="621" y="108" text-anchor="middle" font-size="11" fill="#8A8578">音源を保存中</text>

  <rect x="720" y="60" width="176" height="64" rx="10" fill="#EFEFD3" stroke="#787D2B"/>
  <text x="808" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A382F">COMPLETE</text>
  <text x="808" y="108" text-anchor="middle" font-size="11" fill="#787D2B">完了(tracks 登録)</text>

  <line x1="174" y1="92" x2="194" y2="92" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="348" y1="92" x2="368" y2="92" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="522" y1="92" x2="542" y2="92" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="696" y1="92" x2="716" y2="92" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- グループ注記 -->
  <path d="M24,140 L24,148 L696,148 L696,140" fill="none" stroke="#D9CBB4"/>
  <text x="360" y="168" text-anchor="middle" font-size="11" fill="#8A8578">kie.ai が返すステータス(10 秒間隔のポーリングで取得)</text>
  <text x="808" y="146" text-anchor="middle" font-size="11" fill="#787D2B">音源・カバーの保存後に</text>
  <text x="808" y="162" text-anchor="middle" font-size="11" fill="#787D2B">サーバーが付与</text>

  <!-- FAILED -->
  <rect x="340" y="210" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#B0483C"/>
  <text x="430" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#B0483C">FAILED</text>
  <text x="430" y="256" text-anchor="middle" font-size="11" fill="#8A8578">失敗</text>
  <path d="M200,124 L370,212" fill="none" stroke="#B0483C" stroke-width="1.2" marker-end="url(#arrow3r)"/>
  <path d="M621,124 L490,212" fill="none" stroke="#B0483C" stroke-width="1.2" marker-end="url(#arrow3r)"/>
  <text x="540" y="232" font-size="11" fill="#B0483C">生成失敗(不適切ワード等)・30 分タイムアウト</text>

  <!-- 補足 -->
  <text x="24" y="302" font-size="11" fill="#8A8578">・Suno は通常 2 曲返すが同一歌詞・スタイルのバリエーションのため、1 曲目のみ採用・保存する</text>
  <text x="24" y="322" font-size="11" fill="#8A8578">・一時的な API エラーでは FAILED にせず次回ポーリングで再試行。サーバー再起動時は DB の未完了タスクから自動再開</text>
</svg>
