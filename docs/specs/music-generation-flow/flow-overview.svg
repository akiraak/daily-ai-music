<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#787D2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="14" fill="#FDF2E5"/>

  <!-- 列見出し -->
  <text x="124" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A8578">入口(3 つ)</text>
  <text x="384" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A8578">LLM(頭脳)</text>
  <text x="629" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A8578">音楽生成</text>
  <text x="845" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#8A8578">保存・利用</text>

  <!-- 入口 1: スケジューラ -->
  <rect x="24" y="56" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="124" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">スケジューラ</text>
  <text x="124" y="97" text-anchor="middle" font-size="11" fill="#8A8578">毎朝 6:00(PT)に自動実行</text>
  <text x="124" y="114" text-anchor="middle" font-size="11" fill="#8A8578">mode = daily・1 日 3 曲</text>

  <!-- 入口 2: おまかせ生成 -->
  <rect x="24" y="144" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="124" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">おまかせ生成</text>
  <text x="124" y="185" text-anchor="middle" font-size="11" fill="#8A8578">管理画面・iOS の生成ボタン</text>
  <text x="124" y="202" text-anchor="middle" font-size="11" fill="#8A8578">POST /api/daily/run</text>

  <!-- 入口 3: アーティスト経由生成 -->
  <rect x="24" y="232" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="124" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">アーティスト経由生成</text>
  <text x="124" y="273" text-anchor="middle" font-size="11" fill="#8A8578">曲を選ぶ(mode = artist)</text>
  <text x="124" y="290" text-anchor="middle" font-size="11" fill="#8A8578">POST /api/generate</text>

  <!-- 入口 → LLM -->
  <line x1="224" y1="92" x2="260" y2="112" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="180" x2="260" y2="156" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="268" x2="260" y2="200" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM 生成 -->
  <rect x="264" y="56" width="240" height="196" rx="10" fill="#FFFFFF" stroke="#787D2B"/>
  <text x="384" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">LLM 生成(Claude API)</text>
  <text x="384" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#787D2B">まず web_search で参照曲を調査</text>
  <text x="384" y="120" text-anchor="middle" font-size="11" fill="#8A8578">BPM・キー・コード進行・編成</text>
  <text x="384" y="144" text-anchor="middle" font-size="12" fill="#3A382F">スタイル(英語+日本語訳)</text>
  <text x="384" y="162" text-anchor="middle" font-size="12" fill="#3A382F">歌詞(設定した言語。英語なら訳も)</text>
  <text x="384" y="180" text-anchor="middle" font-size="12" fill="#3A382F">タイトル・狙い(intent)</text>
  <text x="384" y="198" text-anchor="middle" font-size="12" fill="#3A382F">リアルワード 5〜8 語・情報源</text>
  <text x="384" y="222" text-anchor="middle" font-size="11" fill="#8A8578">claude-sonnet-5・構造化出力</text>
  <text x="384" y="238" text-anchor="middle" font-size="11" fill="#8A8578">禁止ワード・固有名詞が残れば 1 回再生成</text>

  <!-- LLM への入力 -->
  <rect x="264" y="300" width="240" height="172" rx="10" fill="none" stroke="#787D2B" stroke-dasharray="5 4"/>
  <text x="284" y="326" font-size="12" font-weight="bold" fill="#787D2B">入力(DB・外部ソース)</text>
  <text x="284" y="350" font-size="12" fill="#3A382F">・リファレンス楽曲(必須)</text>
  <text x="298" y="368" font-size="11" fill="#8A8578">(artist_songs から LRU で選択)</text>
  <text x="284" y="390" font-size="12" fill="#3A382F">・今日のコンテキスト ※daily のみ</text>
  <text x="298" y="408" font-size="11" fill="#8A8578">(ニュース)</text>
  <text x="284" y="430" font-size="12" fill="#3A382F">・リアルワードの使用制限</text>
  <text x="284" y="452" font-size="12" fill="#3A382F">・追加の要望 ※artist のみ</text>
  <line x1="384" y1="300" x2="384" y2="258" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Suno -->
  <rect x="544" y="96" width="170" height="110" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="629" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">Suno(kie.ai)</text>
  <text x="629" y="148" text-anchor="middle" font-size="12" fill="#3A382F">style・歌詞・title を</text>
  <text x="629" y="166" text-anchor="middle" font-size="12" fill="#3A382F">customMode で送信</text>
  <text x="629" y="190" text-anchor="middle" font-size="11" fill="#8A8578">1 リクエスト 12 クレジット</text>
  <line x1="504" y1="151" x2="540" y2="151" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 完了検知・保存 -->
  <rect x="754" y="76" width="182" height="118" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="845" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">完了検知・保存</text>
  <text x="845" y="126" text-anchor="middle" font-size="12" fill="#3A382F">10 秒間隔でポーリング</text>
  <text x="845" y="144" text-anchor="middle" font-size="12" fill="#3A382F">音源・カバーを data/ へ</text>
  <text x="845" y="162" text-anchor="middle" font-size="12" fill="#3A382F">1 曲目のみ tracks 登録</text>
  <text x="845" y="183" text-anchor="middle" font-size="11" fill="#8A8578">完成まで実測 約 2 分</text>
  <line x1="714" y1="151" x2="750" y2="135" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- iPhone・管理画面 -->
  <rect x="754" y="254" width="182" height="96" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="845" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">iPhone・管理画面</text>
  <text x="845" y="304" text-anchor="middle" font-size="12" fill="#3A382F">一覧・再生</text>
  <text x="845" y="324" text-anchor="middle" font-size="12" fill="#3A382F">歌詞・狙い・情報源の閲覧</text>
  <line x1="845" y1="194" x2="845" y2="250" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 参照曲の登録 → 入力 -->
  <rect x="544" y="386" width="392" height="86" rx="10" fill="#FFFFFF" stroke="#D9CBB4"/>
  <text x="740" y="411" text-anchor="middle" font-size="14" font-weight="bold" fill="#3A382F">参照曲の登録(artist_songs)</text>
  <text x="740" y="434" text-anchor="middle" font-size="12" fill="#3A382F">アーティスト名から / 曲名から(iTunes Search API)</text>
  <text x="740" y="456" text-anchor="middle" font-size="11" fill="#8A8578">ここに何を登録するかが、生成される曲の傾向を決める</text>
  <line x1="544" y1="424" x2="508" y2="410" stroke="#787D2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="740" y="500" text-anchor="middle" font-size="12" fill="#787D2B">登録が 0 件だと参照曲を選べないため生成しない</text>
  <text x="740" y="520" text-anchor="middle" font-size="12" fill="#787D2B">(スケジューラは 30 分後に再試行・POST /api/daily/run は 409)</text>
</svg>
