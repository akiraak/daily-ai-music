name: DailyAIMusic
options:
  bundleIdPrefix: com.akiraak.dailyaimusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: N38G4DGA67
    CODE_SIGN_STYLE: Automatic

targets:
  DailyAIMusic:
    type: application
    platform: iOS
    sources:
      - path: DailyAIMusic/Sources
      - path: DailyAIMusic/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.dailyaimusic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 既定は空。実機ビルドは run-ios-device.sh が本番 URL(--local 時は Mac の IP)と
        # .env の API_SECRET を注入する。空のときアプリは http://localhost:3014 にフォールバックする(シミュレータ向け)
        BACKEND_BASE_URL: ""
        BACKEND_API_SECRET: ""
    info:
      path: DailyAIMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Music Plant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 画面ロック・バックグラウンドでも音楽再生を継続する
        UIBackgroundModes:
          - audio
        # ローカル開発用バックエンド(HTTP/非TLS)に接続するため。クラウド化する際に見直す
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        BackendBaseURL: $(BACKEND_BASE_URL)
        BackendAPISecret: $(BACKEND_API_SECRET)

  DailyAIMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DailyAIMusicUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.dailyaimusic.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyAIMusic

schemes:
  DailyAIMusic:
    build:
      targets:
        DailyAIMusic: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyAIMusicUITests
